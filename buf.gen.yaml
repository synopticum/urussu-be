version: v2
plugins:
  # Plugins are pinned as Go tool dependencies in go.mod and invoked via `go tool`.
  - local: [go, tool, protoc-gen-go]
    out: gen
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-go-grpc]
    out: gen
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-grpc-gateway]
    out: gen
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-openapiv2]
    out: gen/openapiv2
    # Merge all services into a single schema — /swagger.json embeds one file.
    opt: allow_merge=true,merge_file_name=swagger
