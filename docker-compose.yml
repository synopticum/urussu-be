# Variables (${...}) come from internal/config/config.env — run via
# `make docker-up` / `make docker-down`, or pass
# `--env-file internal/config/config.env` to docker compose directly.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT}:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Same credentials as the db service, but the in-network db host.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE}
      LOG_LEVEL: ${LOG_LEVEL}
      # The app must listen on the same port we publish (see ports below).
      HTTP_PORT: ${HTTP_PORT}
    ports:
      - "${HTTP_PORT}:${HTTP_PORT}"   # HTTP (REST + swagger.json)

volumes:
  pgdata:
