services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: urussu
      POSTGRES_PASSWORD: urussu
      POSTGRES_DB: urussu_v2
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urussu -d urussu_v2"]
      interval: 2s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://urussu:urussu@db:5432/urussu_v2?sslmode=disable
    ports:
      - "8080:8080"   # HTTP (REST + swagger.json)

volumes:
  pgdata:
